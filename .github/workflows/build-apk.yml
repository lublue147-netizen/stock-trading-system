name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APK
        id: apk-path
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockVision-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Generate Build Summary
        run: |
          echo "### 🚀 Android APK 构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **应用名称**: StockVision 行情" >> $GITHUB_STEP_SUMMARY
          echo "- **架构**: Jetpack Compose + Material 3 + Kotlin" >> $GITHUB_STEP_SUMMARY
          echo "- **构建产物**: 可直接在上方 **Artifacts** 区域下载 \`StockVision-Debug-APK\` 安装包安装到手机或模拟器进行体验。" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
