name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Setup Release Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/release.keystore \
            -alias stockvision -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass stockvision123 -keypass stockvision123 \
            -dname "CN=StockVision, OU=Mobile, O=StockVision, L=US, S=CA, C=US"

      - name: Build Android APKs (Release & Debug)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Collect and Name Output APKs
        run: |
          mkdir -p output_apks
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output_apks/StockVision-Release.apk
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output_apks/StockVision-Debug.apk
          fi
          ls -lh output_apks/

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StockVision-APKs
          path: output_apks/*.apk
          retention-days: 30

      - name: Generate Build Summary
        run: |
          echo "### 🚀 Android APK 构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **应用名称**: StockVision 股票行情" >> $GITHUB_STEP_SUMMARY
          echo "- **架构**: Jetpack Compose + Material 3 + Kotlin" >> $GITHUB_STEP_SUMMARY
          echo "- **包含版本**:" >> $GITHUB_STEP_SUMMARY
          echo "  - \`StockVision-Release.apk\` (正式签名发布包，推荐生产使用)" >> $GITHUB_STEP_SUMMARY
          echo "  - \`StockVision-Debug.apk\` (调试测试包)" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
